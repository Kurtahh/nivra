# Base URL of the Nivra backend as seen from the device.
#   10.0.2.2 is the host machine loopback as seen from the Android emulator.
#   For a physical device, use your machine's LAN IP, e.g. http://192.168.1.20:5207/
nivra.apiBaseUrl=http://10.0.2.2:5207/